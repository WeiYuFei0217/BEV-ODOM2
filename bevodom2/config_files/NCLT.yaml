# BEV-ODOM2 NCLT config. Relative paths are resolved from the working directory (run from the repository root).
dataset_type: "NCLT"
data_root: "/path/to/NCLT"
pair_root: "./pairs/NCLT"   # pair lists: <pair_root>/<sequence>/<pair_file>
output_root: "./outputs"

backbone_conf:
  final_dim: [224, 384]
  x_bound: [-51.2, 51.2, 0.8]   # 128 x 128 BEV grid, 0.8 m per cell
  y_bound: [-51.2, 51.2, 0.8]
  z_bound: [-6, 6, 12]
  d_bound: [0.4, 38.4, 0.15]
  output_channels: 80
  downsample_factor: 16
  img_backbone_conf:
    type: 'ResNet'
    depth: 50
    frozen_stages: 0
    out_indices: [0, 1, 2, 3]
    norm_eval: false
  img_neck_conf:
    type: 'SECONDFPN'
    in_channels: [256, 512, 1024, 2048]
    upsample_strides: [0.25, 0.5, 1, 2]
    out_channels: [128, 128, 128, 128]
  depth_net_conf:
    in_channels: 512
    mid_channels: 512

model_conf:
  corr_patch_size: 9
  use_leakyrelu_bn: true
  max_dis: 3.0   # translation output bound (m)

train_conf:
  seed: 42
  num_workers: 6
  batch_size: 16   # on a single GPU
  max_epochs: 100
  lr: 0.0001
  lr_decay: 0.95   # per-epoch exponential decay
  weight_decay: 0.0001
  # loss weights: lambda_1 (5-DoF PV loss), lambda_2 (flow loss), alpha (3-DoF rotation), beta (5-DoF rotation)
  lambda_5dof: 0.2
  lambda_flow: 0.1
  alpha: 10
  beta: 10
  # backbone initialization; the loaded parameters are frozen for the first freeze_epochs epochs
  pretrained: "pretrained/bevodom2_nclt_init.pth"
  freeze_epochs: 1
  train_sequences: ["2013-04-05", "2012-01-08", "2012-02-04"]
  # enhanced rotation sampling (tools/gen_pairs.py): time window (s), max translation (m), yaw range of S_high (deg)
  pair_window_s: 60
  pair_max_dist: 2.0
  pair_high_rot_deg: [15, 45]
  pair_file: "pairs_w60s_d2_r15_r45.pkl"

eval_conf:
  # the checkpoint with the lowest mean validation RTE is kept as best.pth
  val_sequences: ["2012-05-26"]
  test_sequences: ["2012-02-02", "2012-02-19", "2012-03-17", "2012-08-20"]
  frame_stride: 5   # val/test use every frame_stride-th frame
